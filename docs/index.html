<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>True North Baptist Church Bible Institute</title>
  <meta name="description" content="Student and faculty portal for the True North Baptist Church Bible Institute — Teach Others Also.">
  <meta name="theme-color" content="#1a2c45">
  <link rel="icon" type="image/png" href="brand/favicon.png">
  <link rel="apple-touch-icon" href="brand/tnbbi-logo-color.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Always-fresh loader. GitHub Pages lets browsers reuse files for up
       to 10 minutes without checking, so after an update some people would
       keep running the old site. Instead, each of the site's own files is
       checked with the server on every visit (a tiny "has this changed?"
       request — nothing is re-downloaded unless it did change), then loaded.
       Each file's version tag is kept so the site can notice an update made
       while someone already has it open (see checkForSiteUpdate in app.js). -->
  <style>html.site-loading body { visibility: hidden; }</style>
  <script>
    document.documentElement.classList.add("site-loading");
    window.TNBBI_ASSETS = { css: ["css/styles.css"], js: ["js/config.js", "js/library-data.js", "js/bible-data.js", "js/data.js", "js/app.js"] };
    window.TNBBI_VERSIONS = {};
    window.TNBBI_READY = Promise.all(
      TNBBI_ASSETS.css.concat(TNBBI_ASSETS.js).map(function (url) {
        return fetch(url, { cache: "no-cache" })
          .then(function (r) { TNBBI_VERSIONS[url] = r.headers.get("etag") || r.headers.get("last-modified") || ""; })
          .catch(function () { /* offline or blocked — load whatever the browser has */ });
      })
    );
    TNBBI_READY.then(function () {
      TNBBI_ASSETS.css.forEach(function (href) {
        var l = document.createElement("link");
        l.rel = "stylesheet"; l.href = href;
        l.onload = l.onerror = function () { document.documentElement.classList.remove("site-loading"); };
        document.head.appendChild(l);
      });
      // Never leave the page hidden, even if the stylesheet is slow.
      setTimeout(function () { document.documentElement.classList.remove("site-loading"); }, 4000);
    });
  </script>
</head>
<body>
  <div class="test-banner" id="testBanner" hidden>Test site — real accounts and real data, but not yet open to everyone.</div>

  <header class="top-nav" id="topNav" style="display:none;">
    <div class="top-nav-inner">
      <div class="brand">
        <img src="brand/tnbbi-logo-color-sm.png" alt="True North Baptist Church Bible Institute crest" width="58" height="58">
        <div class="brand-text">True North Baptist Church<br><small>Bible Institute</small></div>
      </div>
      <nav class="nav-pills" id="navPills" aria-label="Main"></nav>
      <div class="role-pills" id="accountPills"></div>
    </div>
  </header>

  <div id="authScreen"></div>
  <main class="main" id="main" style="display:none;"></main>
  <div id="modalRoot"></div>
  <div id="printArea"></div>
  <noscript><p style="padding:24px;text-align:center;">This site needs JavaScript turned on.</p></noscript>

  <!-- Libraries (loaded from public CDNs) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- The site: loaded in order, once the freshness check above is done. -->
  <script>
    TNBBI_READY.then(function () {
      TNBBI_ASSETS.js.reduce(function (prev, src) {
        return prev.then(function () {
          return new Promise(function (resolve) {
            var s = document.createElement("script");
            s.src = src; s.async = false;
            s.onload = s.onerror = resolve;
            document.body.appendChild(s);
          });
        });
      }, Promise.resolve());
    });
  </script>
</body>
</html>
